<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.chat-container{
width:100%;
max-width:420px;
height:600px;
margin:auto;
display:flex;
flex-direction:column;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.header{
background:linear-gradient(135deg,#0f172a,#2563eb);
color:white;
padding:18px;
font-size:20px;
font-weight:bold;
}

.sub{
font-size:12px;
opacity:0.8;
margin-top:4px;
}

.messages{
flex:1;
padding:15px;
overflow-y:auto;
background:#f8fafc;
}

.msg{
max-width:85%;
padding:12px 14px;
margin-bottom:12px;
border-radius:14px;
line-height:1.4;
word-wrap:break-word;
font-size:14px;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
border-bottom-right-radius:4px;
}

.bot{
background:white;
border:1px solid #dbeafe;
color:#111827;
border-bottom-left-radius:4px;
}

.input-area{
display:flex;
padding:12px;
background:white;
border-top:1px solid #e5e7eb;
}

input{
flex:1;
padding:12px;
border:1px solid #cbd5e1;
border-radius:12px;
outline:none;
font-size:14px;
}

button{
margin-left:8px;
padding:12px 18px;
border:none;
background:#2563eb;
color:white;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#1d4ed8;
}

.typing{
font-size:12px;
color:#64748b;
padding:5px 15px;
}

</style>
</head>

<body>

<div class="chat-container">

<div class="header">
SSH AI Assistant
<div class="sub">
Sales Support Hub
</div>
</div>

<div class="messages" id="messages">

<div class="msg bot">
Hello 👋<br><br>
How can I help you today?
</div>

</div>

<div class="typing" id="typing"></div>

<div class="input-area">
<input
type="text"
id="message"
placeholder="Ask anything..."
onkeypress="handleKey(event)"
>
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxQSAsA1_tPuJ0BNc_u6GWxYMOON3D-r1_DgWftROAMH-FxSEJZx2iFBaasL9niTTGR/exec";

function addMessage(text,type){

const div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text.replace(/\n/g,"<br>");

document.getElementById("messages").appendChild(div);

scrollBottom();

}

function scrollBottom(){

const messages=document.getElementById("messages");

messages.scrollTop=messages.scrollHeight;

}

function handleKey(e){

if(e.key==="Enter"){
sendMessage();
}

}

async function sendMessage(){

const input=document.getElementById("message");

const text=input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";

document.getElementById("typing").innerHTML=
"Assistant is typing...";

try{

const response=await fetch(WEBAPP_URL,{
method:"POST",
body:JSON.stringify({
message:text
})
});

const data=await response.json();

document.getElementById("typing").innerHTML="";

addMessage(data.reply,"bot");

}catch(err){

document.getElementById("typing").innerHTML="";

addMessage(
"Something went wrong. Please try again.",
"bot"
);

}

}

</script>

</body>
</html>
