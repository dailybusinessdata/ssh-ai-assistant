<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSH AI Assistant</title>

<style>

body{
margin:0;
font-family:Arial;
background:transparent;
}

#chatButton{

position:fixed;
bottom:20px;
right:20px;

width:65px;
height:65px;

border-radius:50%;

background:#0b57d0;

display:flex;
align-items:center;
justify-content:center;

font-size:30px;
color:white;

cursor:pointer;

box-shadow:0 4px 20px rgba(0,0,0,0.3);

z-index:9999;

}

#chatBox{

position:fixed;
bottom:95px;
right:20px;

width:360px;
height:580px;

background:white;

border-radius:20px;

box-shadow:0 4px 30px rgba(0,0,0,0.2);

display:none;
flex-direction:column;

overflow:hidden;

z-index:9999;

}

#header{

background:#0b57d0;
color:white;

padding:16px;

font-size:18px;
font-weight:bold;

}

#messages{

flex:1;

overflow-y:auto;

padding:15px;

background:#f5f7fb;

}

.msg{

margin-bottom:12px;
padding:12px;

border-radius:14px;

line-height:1.5;

white-space:pre-wrap;

}

.user{

background:#dbe8ff;

}

.bot{

background:white;

}

#inputArea{

display:flex;

padding:10px;

border-top:1px solid #ddd;

}

#input{

flex:1;

padding:12px;

border:1px solid #ccc;

border-radius:10px;

outline:none;

}

button{

margin-left:8px;

padding:12px 16px;

border:none;

border-radius:10px;

background:#0b57d0;

color:white;

cursor:pointer;

}

.quickBtn{

display:block;

margin-top:10px;

padding:10px;

background:#0b57d0;

color:white;

text-align:center;

border-radius:10px;

cursor:pointer;

}

a{
color:#0b57d0;
font-weight:bold;
}

</style>

</head>

<body>

<div id="chatButton">🤖</div>

<div id="chatBox">

<div id="header">
SSH AI Assistant
</div>

<div id="messages"></div>

<div id="inputArea">

<input
id="input"
placeholder="Ask anything..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxQSAsA1_tPuJ0BNc_u6GWxYMOON3D-r1_DgWftROAMH-FxSEJZx2iFBaasL9niTTGR/exec";

const messages =
document.getElementById("messages");

let pendingWebSearch = false;

document
.getElementById("chatButton")
.onclick = () => {

const box =
document.getElementById("chatBox");

box.style.display =
box.style.display === "flex"
? "none"
: "flex";

};

function addMessage(text,type){

const div =
document.createElement("div");

div.className =
"msg " + type;

div.innerHTML =
formatMessage(text);

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

}

function formatMessage(text){

text = text.replace(
/(https?:\/\/[^\s]+)/g,
'<br><a href="$1" target="_blank">Open Link</a>'
);

return text
.replace(/\n/g,"<br>");

}

async function sendMessage(allowWeb=false){

const input =
document.getElementById("input");

const msg =
input.value.trim();

if(!msg) return;

addMessage(msg,"user");

input.value="";

addMessage("⏳ Thinking...","bot");

const botMsgs =
document.querySelectorAll(".bot");

const loading =
botMsgs[botMsgs.length-1];

try{

const res =
await fetch(GAS_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:msg,
allowWeb:allowWeb

})

});

const data =
await res.json();

loading.innerHTML =
formatMessage(data.reply);

if(data.needsConfirm){

loading.innerHTML += `

<div
class="quickBtn"
onclick="confirmWebSearch('${msg}')"
>
🌐 Yes, Search Web
</div>

`;

}

}catch(err){

loading.innerHTML =
"⚠ Error connecting to AI.";

}

}

function confirmWebSearch(msg){

document.getElementById("input").value =
msg;

sendMessage(true);

}

</script>

</body>

</html>
