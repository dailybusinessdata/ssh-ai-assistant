<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SSH AI</title>

<style>

body{
margin:0;
background:transparent;
font-family:Arial;
overflow:hidden;
}

#launcher{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
background:#1e40af;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
box-shadow:0 10px 30px rgba(0,0,0,.3);
z-index:9999;
}

#chatbox{
position:fixed;
bottom:100px;
right:20px;
width:380px;
height:600px;
background:white;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
display:none;
flex-direction:column;
overflow:hidden;
}

#header{
background:#1e3a8a;
color:white;
padding:15px;
font-weight:bold;
}

#messages{
flex:1;
padding:15px;
overflow-y:auto;
background:#f3f4f6;
}

.msg{
margin-bottom:12px;
padding:12px;
border-radius:12px;
line-height:1.5;
}

.user{
background:#dbeafe;
}

.bot{
background:white;
}

#inputArea{
display:flex;
padding:10px;
border-top:1px solid #ddd;
}

#input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}

#send{
margin-left:10px;
padding:12px 16px;
border:none;
background:#2563eb;
color:white;
border-radius:10px;
cursor:pointer;
}

a{
color:#2563eb;
}

</style>
</head>

<body>

<div id="launcher">🤖</div>

<div id="chatbox">

<div id="header">
Sales Support AI
</div>

<div id="messages"></div>

<div id="inputArea">
<input id="input" placeholder="Ask anything...">
<button id="send">Send</button>
</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQSAsA1_tPuJ0BNc_u6GWxYMOON3D-r1_DgWftROAMH-FxSEJZx2iFBaasL9niTTGR/exec";

const launcher = document.getElementById("launcher");
const chatbox = document.getElementById("chatbox");
const messages = document.getElementById("messages");

launcher.onclick = () => {

if(chatbox.style.display==="flex"){
chatbox.style.display="none";
}else{
chatbox.style.display="flex";
}

};

function addMessage(text,type){

const div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=text.replace(/\n/g,"<br>");

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(){

const input=document.getElementById("input");

const text=input.value.trim();

if(!text)return;

addMessage(text,"user");

input.value="";

const res=await fetch(
SCRIPT_URL + "?message=" + encodeURIComponent(text)
);

const data=await res.json();

addMessage(data.reply,"bot");
}

document.getElementById("send").onclick=sendMessage;

document.getElementById("input")
.addEventListener("keypress",e=>{
if(e.key==="Enter")sendMessage();
});

addMessage(
"👋 Hello! How can I help you today?",
"bot"
);

</script>

</body>
</html>
